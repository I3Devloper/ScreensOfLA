name: Kilo Code Bot Automation

on:
    issues:
        types: [opened, labeled, assigned]
    pull_request:
        types: [opened, synchronize, reopened]
    pull_request_review_comment:
        types: [created]
    issue_comment:
        types: [created]

permissions:
    pull-requests: write
    issues: write
    contents: read

jobs:
    triage:
        runs-on: ubuntu-latest
        if: |
            contains(github.event.issue.body, '@kilocode-bot') ||
            contains(github.event.pull_request.body, '@kilocode-bot') ||
            contains(github.event.comment.body, '@kilocode-bot') ||
            contains(github.event.review_comment.body, '@kilocode-bot')
        steps:
            - name: Acknowledge bot mention
              run: |
                  echo "Kilo Code bot mentioned in ${{ github.event_name }}"
                  echo "Issue/PR: ${{ github.event.issue.number || github.event.pull_request.number }}"
                  echo "Repository: ${{ github.repository }}"

            - uses: actions/checkout@v4
              if: github.event_name == 'pull_request'

            - name: Setup Node.js
              if: github.event_name == 'pull_request'
              uses: actions/setup-node@v6
              with:
                  node-version: '20.x'
                  cache: 'npm'

            - name: Install and build
              if: github.event_name == 'pull_request'
              run: |
                  npm ci
                  npm run build

            - name: Run lint check
              if: github.event_name == 'pull_request'
              run: npm run lint:js || true

    auto-label:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        steps:
            - name: Label by file type
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data: files } = await github.rest.pulls.listFiles({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                      });

                      const labels = new Set();
                      const jsFiles = files.some(f => f.filename.match(/\.(js|jsx|ts|tsx)$/));
                      const cssFiles = files.some(f => f.filename.match(/\.(css|scss|sass)$/));
                      const workflowFiles = files.some(f => f.filename.startsWith('.github/workflows/'));
                      const phpFiles = files.some(f => f.filename.endsWith('.php'));
                      const configFiles = files.some(f => f.filename.match(/(package\.json|webpack\.config\.js|tailwind\.config\.js|\.eslintrc)/));

                      if (jsFiles) labels.add('javascript');
                      if (cssFiles) labels.add('styles');
                      if (workflowFiles) labels.add('ci-cd');
                      if (phpFiles) labels.add('php');
                      if (configFiles) labels.add('config');

                      if (labels.size > 0) {
                          await github.rest.issues.addLabels({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              labels: [...labels],
                          });
                      }
