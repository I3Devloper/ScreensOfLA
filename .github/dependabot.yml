version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'America/Chicago'
      open-pull-requests-limit: 10
      reviewers:
          - 'I3-Dev'
      labels:
          - 'dependencies'
      commit-message:
          prefix: 'chore(deps)'
      ignore:
          - dependency-name: 'react'
            versions: ['>=19']
          - dependency-name: 'react-dom'
            versions: ['>=19']

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'America/Chicago'
      labels:
          - 'ci-cd'
          - 'dependencies'
      commit-message:
          prefix: 'chore(ci)'
