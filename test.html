<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Visualizer Local Test</title>
    
    <!-- Load compiled plugin styles -->
    <link rel="stylesheet" href="./assets/build/index.css">
    
    <!-- Load React locally so this test page can run as a real page on localhost -->
    <script src="./node_modules/react/umd/react.development.js"></script>
    <script src="./node_modules/react-dom/umd/react-dom.development.js"></script>
    <script src="./node_modules/react-dom/umd/react-dom-server.browser.development.js"></script>
    
    <!-- Mock WordPress window.wp.element global object -->
    <script>
        window.wp = {
            element: Object.assign({}, window.React, window.ReactDOM, {
                // Map the new React 18 createRoot
                createRoot: window.ReactDOM.createRoot
            })
        };
    </script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-gray-200">
        <div class="mb-6 mb-4 flex items-center justify-between border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">🛠️ Local Test Environment</h1>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-400">Local Webpage</span>
        </div>
        
        <!-- This div simulates what the [screen_visualizer] shortcode outputs in PHP -->
        <div id="screen-visualizer-root" data-width="100%" data-height="600px"></div>
    </div>

    <!-- Load the compiled plugin JavaScript AFTER the mock WP globals and root element -->
    <script src="./assets/build/index.js"></script>
</body>
</html>
